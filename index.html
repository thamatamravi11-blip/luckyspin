<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin Official</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Ad Network Script -->
    <script src="https://alwingulla.com/88/push.js" async data-zone="YOUR_ZONE_ID" data-sdk="show_8985167"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .score-box {
            font-size: 20px;
            background: #ffcc00;
            color: #111;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            margin: 15px 0;
        }
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border: 5px solid #fff;
            border-radius: 50%;
            background: conic-gradient(#ff3366 0deg 60deg, #33ccff 60deg 120deg, #ffcc00 120deg 180deg, #33ff66 180deg 240deg, #9933ff 240deg 300deg, #ff6600 300deg 360deg);
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .spin-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }
        .spin-btn:disabled { background: #555; cursor: not-allowed; }
        .leaderboard {
            margin-top: 30px;
            text-align: left;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 10px;
        }
        .leaderboard h3 { margin-top: 0; color: #ffcc00; text-align: center;}
        .user-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 8px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 Lucky Spin & Win</h1>
    <p style="font-size: 12px; color: #ccc;">టాప్ 10 మందికి ప్రతి వారం Paytm క్యాష్!</p>
    <div class="score-box">నా పాయింట్లు: <span id="points">0</span></div>
    <div class="wheel-container" id="wheel"></div>
    <button class="spin-btn" id="spinBtn" onclick="startSpin()">SPIN NOW 🎰</button>
    
    <div class="leaderboard">
        <h3>🏆 వీక్లీ లీడర్‌బోర్డ్ (Top 5)</h3>
        <div id="leaderboard-list">
            <div style="text-align:center; color:#ccc;">లోడ్ అవుతోంది...</div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Firebase Endpoint
    const dbUrl = "https://luckyspin-bot-default-rtdb.firebaseio.com/users";

    let userId = "guest_" + Math.floor(Math.random() * 100000);
    let userName = "అపరిచిత యూజర్";

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        userId = tg.initDataUnsafe.user.id.toString();
        userName = tg.initDataUnsafe.user.first_name || "User_" + userId;
    }

    let totalPoints = 0;
    let isSpinning = false;

    async function initApp() {
        try {
            const userResponse = await fetch(`${dbUrl}/${userId}.json`);
            const userData = await userResponse.json();
            if (userData && userData.points) {
                totalPoints = userData.points;
                document.getElementById('points').innerText = totalPoints;
            }
            loadLeaderboard();
        } catch (error) {
            console.error("Error initialising app:", error);
            loadLeaderboard();
        }
    }

    async function loadLeaderboard() {
        try {
            const response = await fetch(`${dbUrl}.json`);
            const data = await response.json();
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = "";

            if (!data) {
                listDiv.innerHTML = `<div style="text-align:center; padding:5px; color:#ccc;">ఇంకా ఎవరూ స్పిన్ చేయలేదు! మొదటి వ్యక్తి మీరే అవ్వండి!</div>`;
                return;
            }

            let sortedUsers = [];
            for (let id in data) {
                if(data[id] && data[id].name) {
                    sortedUsers.push({ id: id, name: data[id].name, points: data[id].points || 0 });
                }
            }
            sortedUsers.sort((a, b) => b.points - a.points);
            let topUsers = sortedUsers.slice(0, 5);

            topUsers.forEach((user, index) => {
                const isCurrentUser = user.id === userId ? " (మీరు)" : "";
                const row = document.createElement('div');
                row.className = 'user-row';
                row.innerHTML = `<span>${index + 1}. ${user.name}${isCurrentUser}</span><span>${user.points} Pts</span>`;
                listDiv.appendChild(row);
            });
        } catch (error) {
            console.error("Error loading leaderboard:", error);
        }
    }

    async function savePoints(newPoints) {
        try {
            await fetch(`${dbUrl}/${userId}.json`, {
                method: 'PUT',
                body: JSON.stringify({ name: userName, points: newPoints }),
                headers: { 'Content-Type': 'application/json' }
            });
            loadLeaderboard();
        } catch (error) {
            console.error("Error saving points:", error);
        }
    }

    function startSpin() {
        if (isSpinning) return;
        if (typeof show_8985167 === 'function') {
            show_8985167().then(() => { runWheelLogic(); }).catch((err) => { runWheelLogic(); });
        } else {
            runWheelLogic();
        }
    }

    function runWheelLogic() {
        isSpinning = true;
        document.getElementById('spinBtn').disabled = true;
        const wheel = document.getElementById('wheel');
        const randomDeg = Math.floor(Math.random() * 360) + 1800;
        wheel.style.transform = `rotate(${randomDeg}deg)`;
        
        setTimeout(() => {
            const pointsWon = Math.floor(Math.random() * 50) + 10;
            totalPoints += pointsWon;
            document.getElementById('points').innerText = totalPoints;
            
            savePoints(totalPoints);

            alert(`🎉 అభినందనలు! మీరు ${pointsWon} పాయింట్లు గెలుచుకున్నారు!`);
            
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(${randomDeg % 360}deg)`;
            setTimeout(() => {
                wheel.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.3, 1)';
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 50);
        }, 3000);
    }

    initApp();
</script>
</body>
</html>
