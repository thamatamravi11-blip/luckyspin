<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin Official</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://alwingulla.com/88/push.js" async data-zone="YOUR_ZONE_ID" data-sdk="show_8985167"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .score-box {
            font-size: 20px;
            background: #ffcc00;
            color: #111;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            margin: 15px 0;
        }
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border: 5px solid #fff;
            border-radius: 50%;
            background: conic-gradient(#ff3366 0deg 60deg, #33ccff 60deg 120deg, #ffcc00 120deg 180deg, #33ff66 180deg 240deg, #9933ff 240deg 300deg, #ff6600 300deg 360deg);
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .spin-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            width: 80%;
            margin-bottom: 15px;
        }
        .invite-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            width: 80%;
            margin-bottom: 20px;
        }
        .spin-btn:disabled, .invite-btn:disabled { background: #555; cursor: not-allowed; }
        .leaderboard {
            margin-top: 15px;
            text-align: left;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 10px;
        }
        .leaderboard h3 { margin-top: 0; color: #ffcc00; text-align: center;}
        .user-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 8px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 Lucky Spin & Win</h1>
    <p style="font-size: 12px; color: #ccc;">ప్రతి రెఫరల్‌కి 100 పాయింట్లు బోనస్!</p>
    <div class="score-box">నా పాయింట్లు: <span id="points">0</span></div>
    <div class="wheel-container" id="wheel"></div>
    
    <button class="spin-btn" id="spinBtn" onclick="startSpin()">SPIN NOW 🎰</button>
    <button class="invite-btn" id="inviteBtn" onclick="shareReferral()">ఫ్రెండ్స్‌ని ఇన్వైట్ చేయి 👥</button>
    
    <div class="leaderboard">
        <h3>🏆 వీక్లీ లీడర్‌బోర్డ్ (Top 5)</h3>
        <div id="leaderboard-list">
            <div style="text-align:center; color:#ccc;">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Firebase URL ఎండ్‌పాయింట్
    const dbUrl = "https://luckyspin-bot-default-rtdb.firebaseio.com/users";
    const botUsername = "LuckySpinWin_ravi_bot"; // నీ బోట్ యూజర్‌నేమ్

    let userId = "guest_" + Math.floor(Math.random() * 100000);
    let userName = "అపరిచిత యూజర్";
    let referrerId = null;

    // టెలిగ్రామ్ నుండి యూజర్ డేటా మరియు రెఫరల్ ఐడీ (startapp) రీడ్ చేయడం
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        userId = tg.initDataUnsafe.user.id.toString();
        userName = tg.initDataUnsafe.user.first_name || "User_" + userId;
        
        if (tg.initDataUnsafe.start_param) {
            referrerId = tg.initDataUnsafe.start_param.toString();
        }
    }

    let totalPoints = 0;
    let isSpinning = false;
    let isNewUser = false;

    async function initApp() {
        try {
            const userResponse = await fetch(`${dbUrl}/${userId}.json`);
            const userData = await userResponse.json();
            
            if (userData) {
                totalPoints = userData.points || 0;
                document.getElementById('points').innerText = totalPoints;
            } else {
                // డేటాబేస్‌లో యూజర్ లేకపోతే కొత్త యూజర్ కింద లెక్క
                isNewUser = true;
                await fetch(`${dbUrl}/${userId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ name: userName, points: 0, referredBy: referrerId || "none" }),
                    headers: { 'Content-Type': 'application/json' }
                });
            }
            loadLeaderboard();
        } catch (error) {
            console.error("Error initialising app:", error);
            loadLeaderboard();
        }
    }

    async function loadLeaderboard() {
        try {
            const response = await fetch(`${dbUrl}.json`);
            const data = await response.json();
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = "";

            if (!data) {
                listDiv.innerHTML = `<div style="text-align:center; padding:5px; color:#ccc;">ఇంకా ఎవరూ స్పిన్ చేయలేదు!</div>`;
                return;
            }

            let sortedUsers = [];
            for (let id in data) {
                if(data[id] && data[id].name) {
                    sortedUsers.push({ id: id, name: data[id].name, points: data[id].points || 0 });
                }
            }
            sortedUsers.sort((a, b) => b.points - a.points);
            let topUsers = sortedUsers.slice(0, 5);

            topUsers.forEach((user, index) => {
                const isCurrentUser = user.id === userId ? " (మీరు)" : "";
                const row = document.createElement('div');
                row.className = 'user-row';
                row.innerHTML = `<span>${index + 1}. ${user.name}${isCurrentUser}</span><span>${user.points} Pts</span>`;
                listDiv.appendChild(row);
            });
        } catch (error) {
            console.error("Error loading leaderboard:", error);
        }
    }

    // పాయింట్లు అప్‌డేట్ చేయడం + రెఫరల్ చెక్ లాజిక్
    async function savePoints(newPoints) {
        try {
            // ప్రస్తుత యూజర్ పాయింట్లు అప్‌డేట్
            await fetch(`${dbUrl}/${userId}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ points: newPoints }),
                headers: { 'Content-Type': 'application/json' }
            });

            // కొత్త యూజర్ మొదటిసారి స్పిన్ చేసినప్పుడు రెఫరల్‌కి బోనస్ ఇవ్వడం
            if (isNewUser && referrerId && referrerId !== userId) {
                try {
                    const refResponse = await fetch(`${dbUrl}/${referrerId}.json`);
                    const refData = await refResponse.json();
                    if (refData) {
                        let currentRefPoints = refData.points || 0;
                        let updatedRefPoints = currentRefPoints + 100; // 100 పాయింట్లు బోనస్
                        
                        await fetch(`${dbUrl}/${referrerId}.json`, {
                            method: 'PATCH',
                            body: JSON.stringify({ points: updatedRefPoints }),
                            headers: { 'Content-Type': 'application/json' }
                        });
                    }
                } catch (e) {
                    console.error("Error processing referral bonus:", e);
                }
                isNewUser = false; // బోనస్ ఒకసారే ఇవ్వాలి
            }
            loadLeaderboard();
        } catch (error) {
            console.error("Error saving points:", error);
        }
    }

    // ఫ్రెండ్స్‌కి ఇన్వైట్ లింక్ షేర్ చేసే ఫంక్షన్
    function shareReferral() {
        const refLink = `https://t.me/${botUsername}/spin?startapp=${userId}`;
        const shareText = encodeURIComponent(`🎯 మామా! ఈ లక్కీ స్పిన్ గేమ్ ఆడుతూ వీక్లీ Paytm క్యాష్ గెలుచుకో! నా లింక్ ద్వారా జాయిన్ అవ్వు:`);
        const telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${shareText}`;
        
        // టెలిగ్రామ్ ఇన్-యాప్ బ్రౌజర్‌లో షేర్ విండో ఓపెన్ అవుతుంది
        tg.openTelegramLink(telegramShareUrl);
    }

    function startSpin() {
        if (isSpinning) return;
        if (typeof show_8985167 === 'function') {
            show_8985167().then(() => { runWheelLogic(); }).catch((err) => { runWheelLogic(); });
        } else {
            runWheelLogic();
        }
    }

    function runWheelLogic() {
        isSpinning = true;
        document.getElementById('spinBtn').disabled = true;
        const wheel = document.getElementById('wheel');
        const randomDeg = Math.floor(Math.random() * 360) + 1800;
        wheel.style.transform = `rotate(${randomDeg}deg)`;
        
        setTimeout(() => {
            const pointsWon = Math.floor(Math.random() * 50) + 10;
            totalPoints += pointsWon;
            document.getElementById('points').innerText = totalPoints;
            
            savePoints(totalPoints);

            alert(`🎉 అభినందనలు! మీరు ${pointsWon} పాయింట్లు గెలుచుకున్నారు!`);
            
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(${randomDeg % 360}deg)`;
            setTimeout(() => {
                wheel.style.transition = 'transform 3s cubic-bezier(0.1, 0.8, 0.3, 1)';
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 50);
        }, 3000);
    }

    initApp();
</script>
</body>
</html>
